version: '3.9'

services:
  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base   # use base stage for dev (has devDependencies)
    container_name: searchkraft-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - FRONTEND_URL=http://localhost:3001
    volumes:
      - ./backend/src:/app/src   # hot reload in dev
    command: npx nodemon src/index.js
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (static file server for local dev) ───────────────
  frontend:
    image: nginx:alpine
    container_name: searchkraft-frontend
    ports:
      - "3001:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: searchkraft-network
