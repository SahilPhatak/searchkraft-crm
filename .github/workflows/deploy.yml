name: CD — Deploy to Production

on:
  push:
    branches: [main]          # Only deploy when code merges to main
  workflow_dispatch:          # Also allow manual trigger from GitHub UI

jobs:
  # ── 1. Run CI checks first — don't deploy broken code ─────────────────────
  ci-check:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install & generate Prisma
        run: |
          npm ci
          npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Validate frontend
        working-directory: .
        run: |
          [ -f "public/index.html" ] && echo "✅ Frontend OK" || (echo "❌ index.html missing" && exit 1)

  # ── 2. Deploy backend to Render ───────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: ci-check           # Only runs if CI passed
    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          echo "✅ Render deploy triggered"

      - name: Wait for Render deploy to complete
        run: |
          echo "⏳ Waiting 60s for Render to build and deploy..."
          sleep 60
          # Poll Render API to check deploy status
          STATUS=$(curl -s \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploy']['status'])" 2>/dev/null || echo "unknown")
          echo "Deploy status: $STATUS"
          if [ "$STATUS" = "live" ] || [ "$STATUS" = "unknown" ]; then
            echo "✅ Backend deployed"
          else
            echo "⚠️ Deploy status: $STATUS — check Render dashboard"
          fi

  # ── 3. Deploy frontend to Vercel ──────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: ci-check           # Only runs if CI passed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 4. Post-deploy health check ───────────────────────────────────────────
  health-check:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Check backend is responding
        run: |
          echo "⏳ Checking backend health..."
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.BACKEND_URL }}/health" \
            --max-time 30 || echo "000")
          echo "Backend responded with: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Backend health check returned $HTTP_CODE — check Render logs"
          fi

      - name: Check frontend is responding
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.FRONTEND_URL }}" \
            --max-time 30 || echo "000")
          echo "Frontend responded with: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Frontend is healthy"
          else
            echo "⚠️ Frontend health check returned $HTTP_CODE"
          fi

      - name: Notify deploy success
        run: |
          echo "🚀 Deployment complete!"
          echo "Frontend: ${{ secrets.FRONTEND_URL }}"
          echo "Backend:  ${{ secrets.BACKEND_URL }}"
