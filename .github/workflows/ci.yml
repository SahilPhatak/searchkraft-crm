name: CI — Lint & Health Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: install + prisma + startup check ──────────────────
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check server starts without crash
        run: |
          timeout 10 node server.js &
          PID=$!
          sleep 5
          kill $PID 2>/dev/null || true
          echo "✅ Server started OK"
        env:
          NODE_ENV:                  test
          DATABASE_URL:              ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET:                ${{ secrets.JWT_SECRET }}
          PORT:                      4000

  # ── Docker: build image ───────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t searchkraft-crm-test:${{ github.sha }} .
          echo "✅ Docker image built successfully"

  # ── Frontend: validate HTML ───────────────────────────────────
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html exists and is valid
        run: |
          if [ ! -f "public/index.html" ]; then
            echo "❌ public/index.html missing"
            exit 1
          fi
          SIZE=$(wc -c < public/index.html)
          echo "✅ public/index.html — ${SIZE} bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ index.html too small — possible corruption"
            exit 1
          fi
